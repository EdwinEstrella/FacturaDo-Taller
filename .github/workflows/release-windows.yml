# Compila el instalador de Windows y lo publica como release de GitHub.
# Se dispara al subir una etiqueta vX.Y.Z (debe coincidir con "version" de package.json)
# o a mano desde la pestaña Actions.
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_INSFORGE_URL, NEXT_PUBLIC_INSFORGE_ANON_KEY, INSFORGE_ADMIN_KEY
name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verificar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con package.json ($version)"
            exit 1
          fi

      - run: npm ci

      - name: Crear .env.local
        shell: bash
        env:
          INSFORGE_URL: ${{ secrets.NEXT_PUBLIC_INSFORGE_URL }}
          INSFORGE_ANON: ${{ secrets.NEXT_PUBLIC_INSFORGE_ANON_KEY }}
          INSFORGE_ADMIN: ${{ secrets.INSFORGE_ADMIN_KEY }}
        run: |
          if [ -z "$INSFORGE_URL" ] || [ -z "$INSFORGE_ANON" ]; then
            echo "Faltan los secretos de InsForge"
            exit 1
          fi
          printf 'NEXT_PUBLIC_INSFORGE_URL=%s\nNEXT_PUBLIC_INSFORGE_ANON_KEY=%s\nINSFORGE_ADMIN_KEY=%s\n' \
            "$INSFORGE_URL" "$INSFORGE_ANON" "$INSFORGE_ADMIN" > .env.local

      - name: Compilar y publicar
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
